checkpoint_interval: 1
database:
  db_path: openevolve_work/entity_extraction/output/database
  feature_dimensions:
  - score
  - complexity
  - diversity
  migration_interval: 20
  num_islands: 3
  population_size: 50
evaluator:
  cascade_evaluation: false
  enable_artifacts: true
  use_llm_feedback: true
llm:
  api_base: http://192.168.50.90:8082/v1
  api_key: dummy
  model: gpt5
  models:
  - api_base: http://192.168.50.90:8082/v1
    api_key: dummy
    name: gpt5
    weight: 1.0
  - api_base: http://192.168.50.90:8082/v1
    api_key: dummy
    name: gpt51
    weight: 0.8
  - api_base: http://192.168.50.90:8082/v1
    api_key: dummy
    name: gpt5codex
    weight: 0.6
  - api_base: http://192.168.50.90:8089/v1
    api_key: dummy
    name: gpt-gemini-2.5-flash
    weight: 1.0
  - api_base: http://192.168.50.90:8089/v1
    api_key: dummy
    name: gpt-gemini-2.5-pro
    weight: 0.8
  - api_base: http://192.168.50.90:8089/v1
    api_key: dummy
    name: gpt-gemini-3-flash-preview
    weight: 0.9
  temperature: 0.7
max_iterations: 10
prompt:
  num_diverse_programs: 2
  num_top_programs: 3
  system_message: "You are an expert prompt engineer optimizing a entity_extraction\
    \ prompt for Graphiti, a temporal knowledge graph framework.\n\nTARGET: Improve\
    \ extraction_f1 by 10-20%\n\nOPTIMIZATION OPPORTUNITIES:\n- More precise entity/relationship\
    \ extraction instructions\n- Better handling of ambiguous cases\n- Improved few-shot\
    \ examples\n- Clearer constraint specification\n- Better temporal reasoning instructions\n\
    \nCONSTRAINTS:\n- Do not change the output format (must return valid JSON)\n-\
    \ Maintain compatibility with DSPy signatures\n- Keep instructions under 500 words\n\
    - Preserve core extraction logic\n\nCURRENT CONSTRAINTS TO PRESERVE:\n[\n  \"\
    Entity names must appear in the source text\",\n  \"Each entity must have exactly\
    \ one type\",\n  \"Do not extract pronouns or generic references\"\n]\n\nFocus\
    \ on clarity, precision, and robustness to edge cases."
random_seed: 42
