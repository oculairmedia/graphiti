      - QUEUE_URL=http://graphiti-queued:8080
      - RESILIENT_INGESTION_ENABLED=${RESILIENT_INGESTION_ENABLED:-true}
      - RESILIENT_RETRY_MAX_ATTEMPTS=${RESILIENT_RETRY_MAX_ATTEMPTS:-3}
      - RESILIENT_RETRY_BASE_DELAY=${RESILIENT_RETRY_BASE_DELAY:-2.0}
      - RESILIENT_RETRY_MAX_DELAY=${RESILIENT_RETRY_MAX_DELAY:-60.0}
      - RESILIENT_RETRY_EXPONENTIAL_BASE=${RESILIENT_RETRY_EXPONENTIAL_BASE:-2.0}
      - RESILIENT_CACHE_MAX_AGE_SECONDS=${RESILIENT_CACHE_MAX_AGE_SECONDS:-3600}
      - DEDUP_SIMILARITY_THRESHOLD=${DEDUP_SIMILARITY_THRESHOLD:-0.6}
      - DEDUP_FUZZY_THRESHOLD=${DEDUP_FUZZY_THRESHOLD:-0.9}
      - ENABLE_AGGRESSIVE_DEDUP=${ENABLE_AGGRESSIVE_DEDUP:-true}
