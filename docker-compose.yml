      - graphiti_network
    depends_on:
      falkordb:
        condition: service_healthy
      graph:
        condition: service_healthy
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=MCP Server
      - homepage.icon=si-rss
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:${MCP_PORT:-3010}
      - homepage.description=Model Context Protocol server
  # =============================================================================
  # Cold Boot Initialization Service
  # =============================================================================
  # Waits for FalkorDB to be healthy (RDB reload ~2min)
  graphiti-init:
    image: alpine:latest
    container_name: graphiti-init
    restart: no # Run once on startup, don't restart
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        # Simple init: just verify FalkorDB has data loaded from RDB
        apk add --no-cache redis bash
        echo "Waiting for FalkorDB RDB reload to complete..."
        sleep 5
        # Check edge count
        EDGES=$(redis-cli -h falkordb -p 6379 GRAPH.QUERY graphiti_migration "MATCH ()-[r]->() RETURN count(r)" --csv 2>/dev/null | tail -1)
        echo "FalkorDB has $EDGES edges loaded from RDB persistence"
        if [ "$EDGES" -gt 0 ]; then
          echo "✅ FalkorDB ready with persisted data"
        else
          echo "⚠️ FalkorDB empty - this may be first boot or RDB was lost"
        fi
        touch /tmp/graphiti-init-complete
        echo "Init complete"
    volumes:
      - ./scripts:/scripts:ro
      - init_ready_marker:/tmp
    environment:
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-graphiti_migration}
      - READY_MARKER_FILE=/tmp/graphiti-init-complete
    networks:
      - graphiti_network
    depends_on:
      falkordb:
        condition: service_healthy
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Init Service
      - homepage.icon=si-bootstrap
      - homepage.description=Cold boot initialization (verifies FalkorDB RDB loaded)
  # =============================================================================
  # Queue and Worker Services
  # =============================================================================
  # DEPRECATED: Legacy queue service - use Temporal ingestion instead
  # To enable: docker compose --profile legacy-queue up -d graphiti-queued
  graphiti-queued:
    image: ghcr.io/oculairmedia/graphiti-queued:main
    restart: unless-stopped
    profiles: ["legacy-queue"]
    ports:
      - ${QUEUE_PORT:-8093}:8080
    volumes:
      - queued_data:/data
    environment:
      - QUEUED_DATA_DIR=/data
      - QUEUED_BIND_ADDR=0.0.0.0:8080
      - RUST_LOG=${RUST_LOG:-info}
    networks:
      graphiti_network:
        aliases:
          - queued
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Queue Service (Legacy)
      - homepage.icon=si-queue
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:${QUEUE_PORT:-8093}
      - homepage.description=Legacy message queue - use Temporal instead
  # DEPRECATED: Legacy queue worker - use Temporal staged workers instead
  graphiti-worker:
    image: ghcr.io/oculairmedia/graphiti-worker:main
    restart: unless-stopped
    profiles: ["legacy-queue"]
    command:
      - /bin/bash
      - -c
      - |
        pip install --quiet dspy-ai 2>/dev/null
        if [ "${TEMPORAL_VISIBILITY_ENABLED:-false}" = "true" ] || [ "${TEMPORAL_INGESTION_ENABLED:-false}" = "true" ]; then
          pip install --quiet temporalio 2>/dev/null
        fi
        python -u worker/worker_service.py
    volumes:
      - ./scripts:/scripts:ro
      - ./graphiti_core/llm_client/chutes_client.py:/app/graphiti_core/llm_client/chutes_client.py:ro
      # DSPy pipeline integration
      - ./graphiti_core/dspy:/app/graphiti_core/dspy:ro
      - ./graphiti_core/graphiti.py:/app/graphiti_core/graphiti.py:ro
      - ./worker/worker_service.py:/app/worker/worker_service.py:ro
      # Token compression and prompt utilities
      - ./graphiti_core/utils:/app/graphiti_core/utils:ro
      - ./graphiti_core/search:/app/graphiti_core/search:ro
      - ./graphiti_core/prompts:/app/graphiti_core/prompts:ro
      - ./graphiti_core/ingestion:/app/graphiti_core/ingestion:ro
