# =============================================================================
# Graphiti Knowledge Graph Platform - Main Configuration
# =============================================================================
# Dockge-compatible single-file Docker Compose configuration
# Includes all services: database, API, visualization, and processing services
# Compatible with environment variable management and service profiles

services:
  # =============================================================================
  # Core Database Services
  # =============================================================================
  neo4j:
    image: neo4j:5.26.2
    restart: unless-stopped
    ports:
      - 7474:7474 # HTTP
      - ${NEO4J_PORT:-7687}:${NEO4J_PORT:-7687} # Bolt
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-graphiti123}
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL_SIZE:-6g}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX_SIZE:-6g}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE_SIZE:-4g}
      - NEO4J_server_jvm_additional=${NEO4J_JVM_ADDITIONAL:--XX:+ExitOnOutOfMemoryError}
    mem_limit: 12g
    networks:
      - graphiti_network
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:7474 || exit 1
      interval: 1s
      timeout: 10s
      retries: 10
      start_period: 3s
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Neo4j
      - homepage.icon=si-neo4j
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:7474
      - homepage.description=Primary graph database (persistent storage)
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    ports:
      - ${FALKORDB_PORT:-6379}:6379
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    environment:
      # PERSISTENCE STRATEGY (OOM-safe):
      # - RDB snapshots only (more memory-efficient than AOF during reload)
      # - save 300 1: snapshot every 5 min if ≥1 change
      # - save 60 100: snapshot every 1 min if ≥100 changes
      # - maxmemory 8g: runtime limit (leaves 8g headroom for reload)
      # - stop-writes-on-bgsave-error no: don't block writes if snapshot fails
      # - rdbcompression yes: smaller files, slightly more CPU
      # - rdb-save-incremental-fsync yes: reduces I/O spikes during save
      - REDIS_ARGS=--loglevel warning --maxmemory 8g --maxmemory-policy allkeys-lru --save 300 1 --save 60 100 --dir /var/lib/falkordb/data --dbfilename falkordb.rdb --stop-writes-on-bgsave-error no --rdbcompression yes --rdb-save-incremental-fsync yes
      - FALKORDB_ARGS=NODE_CREATION_BUFFER 128 QUERY_MEM_CAPACITY 134217728 CMD_INFO no OMP_THREAD_COUNT 1 CACHE_SIZE 5
    # MEMORY STRATEGY:
    # - mem_limit 16g: allows 2x headroom for RDB reload (dataset ~5-6GB, reload peaks ~10-12GB)
    # - memswap_limit 20g: 4GB emergency swap buffer if reload exceeds expectations
    # - Runtime maxmemory 8g prevents normal ops from using all 16g
    mem_limit: 16g
    memswap_limit: 20g
    networks:
      - graphiti_network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s  # Allow 3 minutes for RDB reload on large graphs
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=FalkorDB
      - homepage.icon=si-redis
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:${FALKORDB_PORT:-6379}
      - homepage.description=Persisted graph cache (RDB snapshots, ~2min reload)
  # =============================================================================
  # Rust Services
  # =============================================================================
  graph-visualizer-rust:
    image: ghcr.io/oculairmedia/graphiti-rust-visualizer:main
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    ports:
      - ${RUST_SERVER_PORT:-3000}:3000
    volumes:
      - visualizer_duckdb:/app/data
    environment:
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - GRAPH_NAME=${FALKORDB_DATABASE:-graphiti_migration}
      - NODE_LIMIT=${NODE_LIMIT:-100000}
      - EDGE_LIMIT=${EDGE_LIMIT:-100000}
      - MIN_DEGREE_CENTRALITY=${MIN_DEGREE_CENTRALITY:-0}
      - CACHE_ENABLED=${CACHE_ENABLED:-false}
      - CACHE_TTL_SECONDS=60
      - RUST_LOG=${RUST_LOG:-info}
      - CENTRALITY_SERVICE_URL=${RUST_CENTRALITY_URL:-http://graphiti-centrality-rs:3003}
      - DUCKDB_PATH=${DUCKDB_PATH:-/app/data/graph.duckdb}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-2g}
    networks:
      - graphiti_network
    depends_on:
      falkordb:
        condition: service_healthy
      graphiti-centrality-rs:
        condition: service_healthy
      graphiti-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/api/stats
      interval: 15s
      timeout: 5s
      retries: 100
      start_period: 3600s
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Graph Visualizer
      - homepage.icon=si-graphql
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:${RUST_SERVER_PORT:-3000}
      - homepage.description=Rust-powered graph visualization server
  graphiti-centrality-rs:
    image: ghcr.io/oculairmedia/graphiti-centrality-rs:feature-chutes-ai-integration
    restart: unless-stopped
    ports:
      - ${RUST_CENTRALITY_PORT:-3003}:3003
    environment:
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - GRAPH_NAME=${FALKORDB_DATABASE:-graphiti_migration}
      - RUST_LOG=${RUST_LOG:-info}
    networks:
      - graphiti_network
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3003/health
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Centrality Service
      - homepage.icon=si-databricks
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:${RUST_CENTRALITY_PORT:-3003}
      - homepage.description=Graph centrality calculations
  graphiti-search-rs:
    image: ghcr.io/oculairmedia/graphiti-search-rs:main
    restart: unless-stopped
    ports:
      - ${RUST_SEARCH_PORT:-3004}:3004
    environment:
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - GRAPH_NAME=${FALKORDB_DATABASE:-graphiti_migration}
      - REDIS_URL=${REDIS_URL:-redis://falkordb:6379}
      - RUST_LOG=${RUST_LOG:-info}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-2560}
      - MAX_METHOD_RESULTS=${MAX_METHOD_RESULTS:-100}
      - OLLAMA_BASE_URL=${OLLAMA_EMBEDDING_BASE_URL:-http://100.81.139.20:11434/v1}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-dengcao/Qwen3-Embedding-4B:Q4_K_M}
      - RERANKER_ENABLED=${RERANKER_ENABLED:-false}
      - RERANKER_URL=${RERANKER_URL:-http://100.81.139.20:11435}
      - RERANKER_TIMEOUT_MS=${RERANKER_TIMEOUT_MS:-5000}
    networks:
      - graphiti_network
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3004/health
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Search Service
      - homepage.icon=si-elasticsearch
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:${RUST_SEARCH_PORT:-3004}
      - homepage.description=High-performance graph search
  graphiti-sync-rs:
    image: rust-sync-poc-rust-sync:latest
    restart: unless-stopped
    command:
      - sync-loop
      - falkor-to-neo4j
    ports:
      - ${SYNC_HEALTH_PORT:-18080}:8080
      - ${SYNC_METRICS_PORT:-18081}:8081
    volumes:
      - sync_metadata:/data
    environment:
      - SYNC_DISASTER_AUTO_RECOVER=true
      - FORCE_UNSAFE_SYNC=true
      - SYNC_NEO4J_URI=bolt://neo4j:7687
      - SYNC_NEO4J_USER=${NEO4J_USER:-neo4j}
      - SYNC_NEO4J_PASSWORD=${NEO4J_PASSWORD:-graphiti123}
      - SYNC_NEO4J_DATABASE=neo4j
      - SYNC_FALKORDB_HOST=falkordb
      - SYNC_FALKORDB_PORT=6379
      - SYNC_FALKORDB_DATABASE=${FALKORDB_DATABASE:-graphiti_migration}
      - SYNC_SYNC_BATCH_SIZE=${SYNC_BATCH_SIZE:-25}
      - SYNC_PARALLEL_WORKERS=${SYNC_PARALLEL_WORKERS:-8}
      - SYNC_HEALTH_PORT=8080
      - SYNC_METRICS_PORT=8081
      - SYNC_METADATA_DB_PATH=/data/sync_metadata.db
      - SYNC_USE_METADATA_V2=true
      - SYNC_MAX_CONSECUTIVE_FAILURES=10
      - SYNC_CONFLICT_RESOLUTION=last_write_wins
      - SYNC_TIME_THRESHOLD_MINUTES=60
      - SYNC_COUNT_THRESHOLD_PERCENT=5.0
      - SYNC_FALKOR_AUTORESTORE_THRESHOLD=0.80
      - SYNC_BACKOFF_INITIAL_MS=1000
      - SYNC_BACKOFF_MAX_MS=300000
      - RUST_LOG=${RUST_LOG:-info}
    networks:
      - graphiti_network
    depends_on:
      neo4j:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    # Healthcheck disabled - service runs without curl/wget in minimal container
    # Health can be monitored via HTTP endpoint at localhost:18080/health
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Neo4j-FalkorDB Sync
      - homepage.icon=si-rust
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:${SYNC_HEALTH_PORT:-18080}
      - homepage.description=Real-time Neo4j to FalkorDB synchronization
