  # =============================================================================
  # Cold Boot Initialization Service
  # =============================================================================
  graphiti-init:
    image: alpine:latest
    container_name: graphiti-init
    restart: no # Run once on startup, don't restart
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        # Install required tools
        apk add --no-cache curl redis bash grep coreutils
        # Run init script
        bash /scripts/cold-boot-init.sh --no-prompt
    volumes:
      - ./scripts:/scripts:ro
      - init_ready_marker:/tmp
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-graphiti123}
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-graphiti_migration}
      - SYNC_SERVICE_URL=http://graphiti-sync-rs:8080
      - SYNC_TIMEOUT=${SYNC_TIMEOUT:-0}
      - READY_MARKER_FILE=/tmp/graphiti-init-complete
      - CHECK_INTERVAL=5
    networks:
      - graphiti_network
    depends_on:
      neo4j:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      graphiti-sync-rs:
        condition: service_started
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Init Service
      - homepage.icon=si-bootstrap
      - homepage.description=Cold boot initialization (auto-restores FalkorDB)
  # =============================================================================
  # Queue and Worker Services
  # =============================================================================
  graphiti-queued:
    image: ghcr.io/oculairmedia/graphiti-queued:main
    restart: unless-stopped
    ports:
      - ${QUEUE_PORT:-8093}:8080
    volumes:
      - queued_data:/data
    environment:
      - QUEUED_DATA_DIR=/data
      - QUEUED_BIND_ADDR=0.0.0.0:8080
      - RUST_LOG=${RUST_LOG:-info}
    networks:
      graphiti_network:
        aliases:
          - queued
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Queue Service
      - homepage.icon=si-queue
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:${QUEUE_PORT:-8093}
      - homepage.description=Message queue for ingestion processing
  graphiti-worker:
    image: ghcr.io/oculairmedia/graphiti-worker:main
    restart: unless-stopped
    entrypoint:
      - /scripts/worker-entrypoint.sh
    command:
      - python
      - -u
      - worker/worker_service.py
    volumes:
      - ./scripts:/scripts:ro
      - init_ready_marker:/tmp:ro
    environment:
      - READY_MARKER_FILE=/tmp/graphiti-init-complete
      - MAX_WAIT_SECONDS=${INIT_MAX_WAIT:-1800}
      - QUEUE_URL=http://graphiti-queued:8080
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-graphiti123}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - USE_NEO4J=${USE_NEO4J:-true}
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-graphiti_migration}
      - USE_FALKORDB=${USE_FALKORDB:-false}
      - USE_DETERMINISTIC_UUIDS=${USE_DETERMINISTIC_UUIDS:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-dummy}
      - USE_CEREBRAS=${USE_CEREBRAS:-false}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - CEREBRAS_MODEL=${CEREBRAS_MODEL:-qwen-3-coder-480b}
      - CEREBRAS_SMALL_MODEL=${CEREBRAS_SMALL_MODEL:-qwen-3-coder-480b}
      - USE_CHUTES=${USE_CHUTES:-false}
      - CHUTES_API_KEY=${CHUTES_API_KEY:-cpk_8506ccf34be446abb6aba0680ff0555d.bb20b5a1d58c50c9bc051e74b2a39d7c.YAfn45yIG0v39nOaCuVLWbGJiQH0zydP}
      - CHUTES_MODEL=${CHUTES_MODEL:-zai-org/GLM-4.5-FP8}
      - CHUTES_SMALL_MODEL=${CHUTES_SMALL_MODEL:-zai-org/GLM-4.5-FP8}
      - CHUTES_BASE_URL=${CHUTES_BASE_URL:-https://llm.chutes.ai/v1}
      - ENABLE_FALLBACK=${ENABLE_FALLBACK:-true}
      - USE_OLLAMA=${USE_OLLAMA:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://192.168.50.90:8082/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-haiku-4-5}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-dengcao/Qwen3-Embedding-4B:Q4_K_M}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-300}
      - OLLAMA_MAX_RETRIES=${OLLAMA_MAX_RETRIES:-5}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-2560}
      - USE_OLLAMA_EMBEDDINGS=${USE_OLLAMA_EMBEDDINGS:-true}
      - USE_DEDICATED_EMBEDDING_ENDPOINT=${USE_DEDICATED_EMBEDDING_ENDPOINT:-true}
      - OLLAMA_EMBEDDING_BASE_URL=${OLLAMA_EMBEDDING_BASE_URL:-http://192.168.50.80:11434/v1}
      - OLLAMA_EMBEDDING_API_KEY=${OLLAMA_EMBEDDING_API_KEY:-ollama}
      - EMBEDDING_ENDPOINT_FALLBACK=${EMBEDDING_ENDPOINT_FALLBACK:-true}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - WORKER_COUNT=${WORKER_COUNT:-2}
      - BATCH_SIZE=${BATCH_SIZE:-5}
      - POLL_INTERVAL=${POLL_INTERVAL:-2.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GRAPHITI_ENABLE_AUTO_MERGE=${GRAPHITI_ENABLE_AUTO_MERGE:-true}
      - MAX_PROMPT_TOKENS=${MAX_PROMPT_TOKENS:-6000}
      - MAX_EPISODE_CONTENT_CHARS=${MAX_EPISODE_CONTENT_CHARS:-1000}
      - MAX_PREVIOUS_EPISODES=${MAX_PREVIOUS_EPISODES:-1}
      - STRIP_ANSI_CODES=${STRIP_ANSI_CODES:-true}
      - ENABLE_CONTEXT_RERANKING=${ENABLE_CONTEXT_RERANKING:-true}
      - RERANKED_CONTEXT_MAX_TOKENS=${RERANKED_CONTEXT_MAX_TOKENS:-4000}
      - OLLAMA_RERANKER_MODEL=${OLLAMA_RERANKER_MODEL:-dengcao/Qwen3-Reranker-4B:Q5_K_M}
      - OLLAMA_RERANKER_BASE_URL=${OLLAMA_RERANKER_BASE_URL:-http://192.168.50.90:8091}
      - USE_ANTHROPIC=${USE_ANTHROPIC:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-http://192.168.50.90:8082}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      - ANTHROPIC_SMALL_MODEL=${ANTHROPIC_SMALL_MODEL:-claude-3-5-haiku-latest}
    networks:
      - graphiti_network
    depends_on:
      neo4j:
        condition: service_healthy
      graphiti-queued:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      graphiti-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys; sys.exit(0)
        # Basic process check
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Worker
      - homepage.icon=si-worker
      - homepage.description=Ingestion queue worker
  # =============================================================================
  # Reverse Proxy and Load Balancing
  # =============================================================================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - ${NGINX_HTTP_PORT:-8088}:80
      - ${NGINX_HTTPS_PORT:-8443}:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - graphiti_network
    depends_on:
      graph:
        condition: service_healthy
      graph-visualizer-rust:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Nginx Proxy
      - homepage.icon=si-nginx
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:${NGINX_HTTP_PORT:-8088}
      - homepage.description=Reverse proxy and load balancer
  # =============================================================================
  # Optional Services (Profiles)
  # =============================================================================
  # Frontend service (profile-based)
  frontend:
    image: ghcr.io/oculairmedia/graphiti-frontend:feature-chutes-ai-integration
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT:-8084}:80
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=http://graph-visualizer-rust:3000
      - VITE_WS_URL=ws://graph-visualizer-rust:3000/ws
    networks:
      - graphiti_network
    depends_on:
      graph-visualizer-rust:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Frontend
      - homepage.icon=si-react
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:${FRONTEND_PORT:-8084}
      - homepage.description=React frontend interface
  # ===========================================================================
  # Monitoring Stack
  # ===========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: graphiti-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - ${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - graphiti_network
    labels:
      - homepage.group=Monitoring
      - homepage.name=Prometheus
      - homepage.icon=si-prometheus
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:${PROMETHEUS_PORT:-9090}
      - homepage.description=Metrics collection and storage
  grafana:
    image: grafana/grafana:latest
    container_name: graphiti-grafana
    restart: unless-stopped
    ports:
      - ${GRAFANA_PORT:-3001}:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://${HOMEPAGE_HOST:-192.168.50.90}:${GRAFANA_PORT:-3001}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/graphiti-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - graphiti_network
    depends_on:
      - prometheus
    labels:
      - homepage.group=Monitoring
      - homepage.name=Grafana
      - homepage.icon=si-grafana
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.50.90}:${GRAFANA_PORT:-3001}
      - homepage.description=Metrics visualization and dashboards
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: graphiti-redis-exporter
    restart: unless-stopped
    ports:
      - ${REDIS_EXPORTER_PORT:-9121}:9121
    environment:
      - REDIS_ADDR=redis://falkordb:6379
    networks:
      - graphiti_network
    depends_on:
      - falkordb
    labels:
      - homepage.group=Monitoring
      - homepage.name=Redis Exporter
      - homepage.icon=si-redis
      - homepage.description=FalkorDB metrics exporter
# =============================================================================
# Shared Volumes
# =============================================================================
volumes:
  neo4j_data:
    driver: local
    labels:
      - description=Neo4j persistent data
  falkordb_data:
    driver: local
    labels:
      - description=FalkorDB RDB persistence (survives restarts, ~2min reload vs 2-3hr sync)
  queued_data:
    driver: local
    labels:
      - description=Queue service persistent data
  nginx_logs:
    driver: local
    labels:
      - description=Nginx access and error logs
  visualizer_duckdb:
    driver: local
    labels:
      - description=Graph visualizer DuckDB persistent cache
  sync_metadata:
    driver: local
    labels:
      - description=Sync service metadata and state tracking
  prometheus_data:
    driver: local
    labels:
      - description=Prometheus metrics storage
  grafana_data:
    driver: local
    labels:
      - description=Grafana dashboards and configuration
  init_ready_marker:
    driver: local
    labels:
      - description=Cold boot initialization ready marker
# =============================================================================
# Networks
# =============================================================================
networks:
  graphiti_network:
    driver: bridge
    labels:
      - description=Graphiti application network
