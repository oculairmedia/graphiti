<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphiti - Knowledge Graph Visualization</title>
    <meta name="description" content="Modern knowledge graph visualization system for exploring complex data relationships with WebGL rendering" />
    <meta name="author" content="Graphiti Team" />

    <meta property="og:title" content="Graphiti - Knowledge Graph Visualization" />
    <meta property="og:description" content="Modern knowledge graph visualization system for exploring complex data relationships with WebGL rendering" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Enhanced resource hints for faster loading -->
    <link rel="preconnect" href="http://192.168.50.90:3000" crossorigin>
    <link rel="dns-prefetch" href="http://192.168.50.90:3000">
    <link rel="preconnect" href="http://192.168.50.90:8088" crossorigin>
    <link rel="dns-prefetch" href="http://192.168.50.90:8088">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    
    <!-- Server configuration for preloader -->
    <meta name="rust-server-url" content="http://192.168.50.90:3000" />
    
    <!-- Early preloading script - starts data fetch before React loads -->
    <script>
      (function() {
        // Start fetching critical data immediately
        window.__PRELOAD_CACHE__ = {};
        window.__PRELOAD_START_TIME__ = performance.now();

        // Get server URL from meta tag for remote server support
        // This allows early preload to work correctly in dev mode (where proxy may not be ready)
        var metaTag = document.querySelector('meta[name="rust-server-url"]');
        var serverUrl = metaTag ? metaTag.getAttribute('content') : window.location.origin;
        console.log('[EarlyPreload] Using server URL:', serverUrl);

        // Add cache-busting timestamp to ensure fresh data
        const cacheBuster = '?t=' + Date.now();
        
        // Helper function to add timeout to fetch
        function fetchWithTimeout(url, options, timeoutMs) {
          return Promise.race([
            fetch(url, options),
            new Promise(function(_, reject) {
              setTimeout(function() { reject(new Error('Fetch timeout after ' + timeoutMs + 'ms')); }, timeoutMs);
            })
          ]);
        }

        // Fetch nodes data with CORS support and 30s timeout
        window.__PRELOAD_CACHE__.nodesPromise = fetchWithTimeout(serverUrl + '/api/arrow/nodes' + cacheBuster, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-cache',
          credentials: 'omit',
          headers: {
            'Accept': 'application/octet-stream',
            'Cache-Control': 'no-cache',
            'Pragma': 'no-cache'
          }
        }, 30000)
          .then(function(r) {
            if (!r.ok) {
              throw new Error('HTTP ' + r.status + ': ' + r.statusText);
            }
            return r.arrayBuffer();
          })
          .then(function(data) {
            console.log('[EarlyPreload] Nodes loaded:', (data.byteLength / 1024).toFixed(2) + 'KB');
            window.__PRELOAD_CACHE__.nodes = data;
            return data;
          })
          .catch(function(err) {
            console.error('[EarlyPreload] Failed to preload nodes:', err.message || err);
            return null;
          });

        // Fetch edges data with CORS support and 30s timeout
        window.__PRELOAD_CACHE__.edgesPromise = fetchWithTimeout(serverUrl + '/api/arrow/edges' + cacheBuster, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-cache',
          credentials: 'omit',
          headers: {
            'Accept': 'application/octet-stream',
            'Cache-Control': 'no-cache',
            'Pragma': 'no-cache'
          }
        }, 30000)
          .then(function(r) {
            if (!r.ok) {
              throw new Error('HTTP ' + r.status + ': ' + r.statusText);
            }
            return r.arrayBuffer();
          })
          .then(function(data) {
            console.log('[EarlyPreload] Edges loaded:', (data.byteLength / 1024).toFixed(2) + 'KB');
            window.__PRELOAD_CACHE__.edges = data;
            return data;
          })
          .catch(function(err) {
            console.error('[EarlyPreload] Failed to preload edges:', err.message || err);
            return null;
          });
        
        // Report timing when both complete
        Promise.all([
          window.__PRELOAD_CACHE__.nodesPromise,
          window.__PRELOAD_CACHE__.edgesPromise
        ]).then(function(results) {
          var elapsed = performance.now() - window.__PRELOAD_START_TIME__;
          var nodesLoaded = results[0] && results[0].byteLength > 0;
          var edgesLoaded = results[1] && results[1].byteLength > 0;
          console.log('[EarlyPreload] Data preloading completed in', elapsed.toFixed(2) + 'ms', {
            nodesLoaded: nodesLoaded,
            edgesLoaded: edgesLoaded,
            nodesSize: results[0] ? results[0].byteLength : 0,
            edgesSize: results[1] ? results[1].byteLength : 0
          });
        });

        // Timeout warning after 5 seconds
        setTimeout(function() {
          if (!window.__PRELOAD_CACHE__.nodes || !window.__PRELOAD_CACHE__.edges) {
            console.warn('[EarlyPreload] Still waiting after 5 seconds - possible network/CORS issue', {
              nodesLoaded: !!window.__PRELOAD_CACHE__.nodes,
              edgesLoaded: !!window.__PRELOAD_CACHE__.edges,
              serverUrl: serverUrl
            });
          }
        }, 5000);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
