version: '3.8'

services:
  frontend:
    image: graphiti-frontend:latest
    container_name: graphiti-frontend
    ports:
      - "8088:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
