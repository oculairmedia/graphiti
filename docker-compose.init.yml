# =============================================================================
# Graphiti Cold Boot Initialization Service
# =============================================================================
# This file adds an initialization service that manages cold boot state restoration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.init.yml up

services:
  # =============================================================================
  # Initialization Service
  # =============================================================================
  graphiti-init:
    image: redis:alpine
    container_name: graphiti-init
    restart: "no"  # Run once and exit
    command: /scripts/cold-boot-init.sh --no-prompt
    volumes:
      - ./scripts:/scripts:ro
      - init_marker:/tmp
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-graphiti123}
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-graphiti_migration}
      - SYNC_SERVICE_URL=http://graphiti-sync-rs:8080
      - SYNC_TIMEOUT=${SYNC_TIMEOUT:-600}
      - READY_MARKER_FILE=/tmp/graphiti-init-complete
    networks:
      - graphiti_network
    depends_on:
      neo4j:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      graphiti-sync-rs:
        condition: service_started
    labels:
      - homepage.group=Knowledge Management
      - homepage.name=Init Service
      - homepage.icon=si-bootstrap
      - homepage.description=Cold boot initialization orchestrator

  # =============================================================================
  # Modified Worker Service (waits for initialization)
  # =============================================================================
  graphiti-worker:
    entrypoint: ["/scripts/worker-entrypoint.sh"]
    command: ["python", "-u", "worker/worker.py"]
    volumes:
      - ./scripts:/scripts:ro
      - init_marker:/tmp:ro
    environment:
      - READY_MARKER_FILE=/tmp/graphiti-init-complete
      - MAX_WAIT_SECONDS=${INIT_MAX_WAIT:-1800}
    depends_on:
      graphiti-init:
        condition: service_completed_successfully

# =============================================================================
# Shared Volumes
# =============================================================================
volumes:
  init_marker:
    driver: local
    labels:
      - description=Initialization state marker
