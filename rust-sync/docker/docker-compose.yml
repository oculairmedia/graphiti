version: '3.8'

services:
  # Test Neo4j instance
  neo4j-test:
    image: neo4j:5.26.2
    ports:
      - "7475:7474"  # Different from main stack
      - "7688:7687"  # Different from main stack
    environment:
      - NEO4J_AUTH=neo4j/testpass123
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - neo4j_test_data:/data
    networks:
      - sync_test_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10

  # Test FalkorDB instance
  falkordb-test:
    image: falkordb/falkordb:latest
    ports:
      - "6380:6379"  # Different from main stack
    environment:
      - REDIS_ARGS=--loglevel warning --maxmemory 1g --maxmemory-policy allkeys-lru --save ""
    networks:
      - sync_test_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  # Rust sync service (when ready)
  rust-sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    depends_on:
      neo4j-test:
        condition: service_healthy
      falkordb-test:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j-test:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testpass123
      - NEO4J_DATABASE=neo4j
      - FALKORDB_HOST=falkordb-test
      - FALKORDB_PORT=6379
      - FALKORDB_DATABASE=test_graph
      - SYNC_BATCH_SIZE=1000
      - RUST_LOG=info
      - SYNC_METRICS_PORT=8081
    networks:
      - sync_test_network
    ports:
      - "8080:8080"
      - "8081:8081"
    mem_limit: 512m
    cpus: "1.0"
    profiles:
      - sync  # Only start when explicitly requested

volumes:
  neo4j_test_data:

networks:
  sync_test_network:
    driver: bridge
