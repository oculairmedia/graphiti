[package]
name = "graphiti-sync-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"

[dependencies]
# Database clients
neo4rs = "0.9.0-rc.8"
falkordb = { version = "0.1.11", features = ["tokio", "tokio-rustls", "tracing"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Async runtime
tokio = { version = "1.45", features = ["full"] }
futures = "0.3"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.14"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"
once_cell = "1.19"
prometheus = "0.13"

# System information for auto-scaling
sysinfo = "0.30"
num_cpus = "1.16"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# HTTP server for health checks
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "graphiti-sync-rs"
path = "src/main.rs"
