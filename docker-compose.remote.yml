# =============================================================================
# Graphiti Knowledge Graph Platform - Remote/Small Box (16GB)
# =============================================================================
# Production stack for 192.168.50.219 (dockge)
# Includes visualizer and frontend, no grafana/prometheus
# Memory-tuned for 16GB RAM + 8GB swap
#
# Services exposed on LAN:
#   - FalkorDB:    6379
#   - Graph API:   8003
#   - Search-RS:   3004
#   - Centrality:  3003
#   - MCP:         3010
#   - Visualizer:  3000
#   - Frontend:    8084
#   - Nginx:       8088

services:
  # =============================================================================
  # Core Database
  # =============================================================================
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 300s
    ports:
      - ${FALKORDB_PORT:-6379}:6379
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    environment:
      # MEMORY-TUNED for 16GB box:
      # - maxmemory 6g: graph data limit (1.4GB RDB expands to ~5GB)
      # - save 86400 1: snapshot once per 24h
      - REDIS_ARGS=--loglevel warning --maxmemory 6g --maxmemory-policy allkeys-lru --save 86400 1 --dir /var/lib/falkordb/data --dbfilename falkordb.rdb --stop-writes-on-bgsave-error no --rdbcompression yes --rdb-save-incremental-fsync yes --notify-keyspace-events KEA
      # TUNED for 4-core box:
      - FALKORDB_ARGS=THREAD_COUNT 4 OMP_THREAD_COUNT 2 CACHE_SIZE 50 NODE_CREATION_BUFFER 64 QUERY_MEM_CAPACITY 2147483648 CMD_INFO no
    # Container limit 8GB (leaves headroom for BGSAVE fork)
    mem_limit: 8g
    memswap_limit: 12g
    networks:
      - graphiti_network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 600s
    labels:
      - homepage.group=Knowledge Graph
      - homepage.name=FalkorDB
      - homepage.icon=si-redis
      - homepage.description=Graph database (remote)

  # =============================================================================
  # Rust Services
  # =============================================================================
  graphiti-centrality-rs:
    image: ghcr.io/oculairmedia/graphiti-centrality-rs:main
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    ports:
      - ${RUST_CENTRALITY_PORT:-3003}:3003
    environment:
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - GRAPH_NAME=${FALKORDB_DATABASE:-graphiti_migration}
      - RUST_LOG=${RUST_LOG:-info}
    networks:
      - graphiti_network
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3003/health
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - homepage.group=Knowledge Graph
      - homepage.name=Centrality Service
      - homepage.icon=si-databricks
      - homepage.description=Graph centrality calculations
      - homepage.enable=false

  graphiti-search-rs:
    image: ghcr.io/oculairmedia/graphiti-search-rs:main
    restart: unless-stopped
    mem_limit: 1500m
    memswap_limit: 2g
    ports:
      - ${RUST_SEARCH_PORT:-3004}:3004
    environment:
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - GRAPH_NAME=${FALKORDB_DATABASE:-graphiti_migration}
      - REDIS_URL=${REDIS_URL:-redis://falkordb:6379}
      - RUST_LOG=${RUST_LOG:-info}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-2560}
      - MAX_METHOD_RESULTS=${MAX_METHOD_RESULTS:-100}
      - OLLAMA_BASE_URL=${OLLAMA_EMBEDDING_BASE_URL:-http://192.168.50.247:11450/v1}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding}
      - RERANKER_ENABLED=${RERANKER_ENABLED:-true}
      - RERANKER_URL=${RERANKER_URL:-http://192.168.50.247:11435}
      - RERANKER_TIMEOUT_MS=${RERANKER_TIMEOUT_MS:-10000}
    networks:
      - graphiti_network
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3004/health
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - homepage.group=Knowledge Graph
      - homepage.name=Search Service
      - homepage.icon=si-elasticsearch
      - homepage.description=High-performance graph search
      - homepage.enable=false

  # =============================================================================
  # API and MCP Services
  # =============================================================================
  graph:
    image: ghcr.io/oculairmedia/graphiti-api:main
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - ${API_PORT:-8003}:8000
    command:
      - /bin/bash
      - -c
      - |
        pip install --quiet --target=/app/server/.venv/lib/python3.12/site-packages temporalio 2>/dev/null || true
        exec /app/start.sh
    volumes:
      - ./graphiti_core:/app/graphiti_core:ro
      - ./server/graph_service/zep_graphiti.py:/app/server/graph_service/zep_graphiti.py:ro
      - ./server/graph_service/queue_proxy.py:/app/server/graph_service/queue_proxy.py:ro
      - ./server/graph_service/routers/search_proxy.py:/app/server/graph_service/routers/search_proxy.py:ro
      - ./server/graph_service/routers/ingest.py:/app/server/graph_service/routers/ingest.py:ro
      - ./server/graph_service/webhooks.py:/app/server/graph_service/webhooks.py:ro
      - ./server/graph_service/dto/common.py:/app/server/graph_service/dto/common.py:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-dummy}
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - FALKORDB_URI=${FALKORDB_URI:-redis://falkordb:6379}
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-graphiti_migration}
      - USE_DETERMINISTIC_UUIDS=${USE_DETERMINISTIC_UUIDS:-true}
      - PORT=8000
      - USE_CEREBRAS=${USE_CEREBRAS:-false}
      - USE_CHUTES=${USE_CHUTES:-true}
      - CHUTES_API_KEY=${CHUTES_API_KEY}
      - CHUTES_MODEL=${CHUTES_MODEL:-zai-org/GLM-4.7-FP8}
      - CHUTES_SMALL_MODEL=${CHUTES_SMALL_MODEL:-glm-4.5-air}
      - CHUTES_BASE_URL=${CHUTES_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      - ENABLE_FALLBACK=${ENABLE_FALLBACK:-true}
      - USE_ANTHROPIC=${USE_ANTHROPIC:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-http://192.168.50.90:8082}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      - ANTHROPIC_SMALL_MODEL=${ANTHROPIC_SMALL_MODEL:-claude-3-5-haiku-latest}
      - USE_OLLAMA=${USE_OLLAMA:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://100.81.139.20:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-glm-4.7}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-2560}
      - USE_OLLAMA_EMBEDDINGS=${USE_OLLAMA_EMBEDDINGS:-true}
      - USE_DEDICATED_EMBEDDING_ENDPOINT=${USE_DEDICATED_EMBEDDING_ENDPOINT:-true}
      - OLLAMA_EMBEDDING_BASE_URL=${OLLAMA_EMBEDDING_BASE_URL:-http://192.168.50.247:11450/v1}
      - OLLAMA_EMBEDDING_API_KEY=${OLLAMA_EMBEDDING_API_KEY:-ollama}
      - EMBEDDING_ENDPOINT_FALLBACK=${EMBEDDING_ENDPOINT_FALLBACK:-true}
      - USE_RUST_CENTRALITY=${USE_RUST_CENTRALITY:-true}
      - RUST_CENTRALITY_URL=${RUST_CENTRALITY_URL:-http://graphiti-centrality-rs:3003}
      - AUTO_CENTRALITY_ENABLED=${AUTO_CENTRALITY_ENABLED:-true}
      - RUST_SEARCH_URL=${RUST_SEARCH_URL:-http://graphiti-search-rs:3004}
      - USE_RUST_SEARCH=${USE_RUST_SEARCH:-true}
      - RERANKER_ENABLED=${RERANKER_ENABLED:-true}
      - RERANKER_URL=${RERANKER_URL:-http://192.168.50.247:11435}
      - NODE_LIMIT=${NODE_LIMIT:-100000}
      - EDGE_LIMIT=${EDGE_LIMIT:-1000000}
      - MIN_DEGREE_CENTRALITY=${MIN_DEGREE_CENTRALITY:-0}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_DEBUG_LOGGING=${ENABLE_DEBUG_LOGGING:-false}
      - ENABLE_CACHE_INVALIDATION=${ENABLE_CACHE_INVALIDATION:-true}
      - TEMPORAL_INGESTION_ENABLED=${TEMPORAL_INGESTION_ENABLED:-true}
      - TEMPORAL_VISIBILITY_ADDRESS=${TEMPORAL_VISIBILITY_ADDRESS:-192.168.50.90:7233}
      - TEMPORAL_VISIBILITY_NAMESPACE=${TEMPORAL_VISIBILITY_NAMESPACE:-graphiti}
      - TEMPORAL_INGESTION_WORKFLOW_TASK_QUEUE=${TEMPORAL_INGESTION_WORKFLOW_TASK_QUEUE:-graphiti-ingestion-workflow}
