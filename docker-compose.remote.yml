  # =============================================================================
  # Visualization Services
  # =============================================================================
  graph-visualizer-rust:
    image: ghcr.io/oculairmedia/graphiti-rust-visualizer:main
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    ports:
      - ${RUST_SERVER_PORT:-3000}:3000
    volumes:
      - visualizer_duckdb:/app/data
    environment:
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - GRAPH_NAME=${FALKORDB_DATABASE:-graphiti_migration}
      - NODE_LIMIT=${NODE_LIMIT:-100000}
      - EDGE_LIMIT=${EDGE_LIMIT:-100000}
      - MIN_DEGREE_CENTRALITY=${MIN_DEGREE_CENTRALITY:-0}
      - CACHE_ENABLED=${CACHE_ENABLED:-false}
      - CACHE_TTL_SECONDS=60
      - RUST_LOG=${RUST_LOG:-info}
      - CENTRALITY_SERVICE_URL=${RUST_CENTRALITY_URL:-http://graphiti-centrality-rs:3003}
      - DUCKDB_PATH=${DUCKDB_PATH:-/app/data/graph.duckdb}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-1g}
      - RECONCILIATION_ENABLED=false
    networks:
      - graphiti_network
    depends_on:
      falkordb:
        condition: service_healthy
      graphiti-centrality-rs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    labels:
      - homepage.group=Knowledge Graph
      - homepage.name=Graph Visualizer
      - homepage.icon=si-graphql
      - homepage.href=http://192.168.50.219:${RUST_SERVER_PORT:-3000}
      - homepage.description=Interactive graph visualization

  frontend:
    image: ghcr.io/oculairmedia/graphiti-frontend:main
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT:-8084}:80
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=http://graph-visualizer-rust:3000
      - VITE_WS_URL=ws://graph-visualizer-rust:3000/ws
    networks:
      - graphiti_network
    depends_on:
      graph-visualizer-rust:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    labels:
      - homepage.group=Knowledge Graph
      - homepage.name=Frontend
      - homepage.icon=si-react
      - homepage.href=http://192.168.50.219:${FRONTEND_PORT:-8084}
      - homepage.description=React frontend interface

  # =============================================================================
  # Reverse Proxy
  # =============================================================================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - ${NGINX_HTTP_PORT:-8088}:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - graphiti_network
    depends_on:
      graph:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    labels:
      - homepage.group=Knowledge Graph
      - homepage.name=Nginx Proxy
      - homepage.icon=si-nginx
      - homepage.description=Reverse proxy
      - homepage.enable=false

# =============================================================================
# Volumes
# =============================================================================
volumes:
  falkordb_data:
    driver: local
    labels:
      - description=FalkorDB RDB persistence
  visualizer_duckdb:
    driver: local
    labels:
      - description=Graph visualizer DuckDB cache
  nginx_logs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  graphiti_network:
    driver: bridge
