# Docker Compose override to fix sync service edge extraction hang
# This increases memory allocation to resolve GRAPH-574
version: '3.8'

services:
  sync-service:
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    environment:
      # FIXED: Re-enable optimization with startNode/endNode UUID fix
      - SYNC_OPTIMIZATION_ENABLED=true
      # Reduce batch size as additional safety measure (minimum allowed is 1000)
      - SYNC_OPTIMIZATION_EDGE_BATCH_SIZE=1000
      # Add memory monitoring
      - PYTHONUNBUFFERED=1
