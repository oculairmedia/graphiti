global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'graphiti-stack'
    environment: 'production'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Rust Sync Service
  - job_name: 'graphiti-sync'
    static_configs:
      - targets: ['graphiti-sync-rs:8081']
    metrics_path: '/metrics'

  # Graph Visualizer
  - job_name: 'graph-visualizer'
    static_configs:
      - targets: ['graph-visualizer-rust:3000']
    metrics_path: '/api/stats'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.*'
        action: keep

  # Neo4j Metrics
  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:7474']
    metrics_path: '/metrics'

  # Queue Service
  - job_name: 'graphiti-queue'
    static_configs:
      - targets: ['graphiti-queued:8080']
    metrics_path: '/health'

  # FalkorDB (Redis Exporter needed)
  - job_name: 'falkordb'
    static_configs:
      - targets: ['redis-exporter:9121']

  # API Server
  - job_name: 'graphiti-api'
    static_configs:
      - targets: ['graph:8000']
    metrics_path: '/metrics'
