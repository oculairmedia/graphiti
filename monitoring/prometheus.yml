global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'graphiti-stack'
    environment: 'production'

# GRAPH-114: Alert rules for reconciliation and event sourcing
rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Rust Sync Service
  - job_name: 'graphiti-sync'
    static_configs:
      - targets: ['graphiti-sync-rs:8081']
    metrics_path: '/metrics'

  # Graph Visualizer - GRAPH-110: Updated to use proper /metrics endpoint
  - job_name: 'graph-visualizer'
    static_configs:
      - targets: ['graph-visualizer-rust:3000']
    metrics_path: '/metrics'

  # Neo4j Metrics
  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:7474']
    metrics_path: '/metrics'

  # Queue Service
  - job_name: 'graphiti-queue'
    static_configs:
      - targets: ['graphiti-queued:8080']
    metrics_path: '/health'

  # FalkorDB (Redis Exporter needed)
  - job_name: 'falkordb'
    static_configs:
      - targets: ['redis-exporter:9121']

  # API Server
  - job_name: 'graphiti-api'
    static_configs:
      - targets: ['graph:8000']
    metrics_path: '/metrics'

  # Temporal Ingestion Workers
  - job_name: 'temporal-workers'
    static_configs:
      - targets:
        - 'graphiti-temporal-ingestion-workflow-worker:9190'
        - 'graphiti-temporal-ingestion-extract-worker:9191'
        - 'graphiti-temporal-ingestion-resolve-worker:9192'
        - 'graphiti-temporal-ingestion-edge-worker:9193'
        - 'graphiti-temporal-ingestion-persist-worker:9194'
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        regex: 'graphiti-temporal-ingestion-(.+)-worker:.+'
        target_label: 'worker_stage'
        replacement: '${1}'

  # Temporal Monitoring Worker
  - job_name: 'temporal-monitoring'
    static_configs:
      - targets: ['graphiti-temporal-monitoring-worker:9195']
    metrics_path: '/metrics'
